name: Arc Mainnet Read-only Preflight

on:
  push:
    branches:
      - arc-mainnet-readonly-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Arc mainnet (read-only)
        uses: actions/github-script@v7
        with:
          script: |
            const rpc = 'https://rpc.mainnet.arc.io';
            const usdc = '0x3600000000000000000000000000000000000000';

            async function rpcCall(method, params = []) {
              const response = await fetch(rpc, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw new Error(`${method}: HTTP ${response.status}`);
              const body = await response.json();
              if (body.error) throw new Error(`${method}: ${JSON.stringify(body.error)}`);
              if (body.result === undefined) throw new Error(`${method}: missing result`);
              return body.result;
            }

            const [chainIdHex, blockHex, code, symbolHex, decimalsHex] = await Promise.all([
              rpcCall('eth_chainId'),
              rpcCall('eth_blockNumber'),
              rpcCall('eth_getCode', [usdc, 'latest']),
              rpcCall('eth_call', [{ to: usdc, data: '0x95d89b41' }, 'latest']),
              rpcCall('eth_call', [{ to: usdc, data: '0x313ce567' }, 'latest'])
            ]);

            const chainId = Number(BigInt(chainIdHex));
            const blockNumber = BigInt(blockHex);
            const hasCode = typeof code === 'string' && code !== '0x' && code !== '0x0';
            const symbol = symbolHex.length >= 130
              ? Buffer.from(symbolHex.slice(130).replace(/00+$/, ''), 'hex').toString('utf8')
              : 'unreadable';
            const decimals = Number(BigInt(decimalsHex));

            core.info(`RPC endpoint: ${rpc}`);
            core.info(`Chain ID: ${chainId}`);
            core.info(`Latest block: ${blockNumber.toString()}`);
            core.info(`USDC address: ${usdc}`);
            core.info(`USDC bytecode present: ${hasCode}`);
            core.info(`USDC symbol: ${symbol}`);
            core.info(`USDC ERC-20 decimals: ${decimals}`);
            core.info('Arc native USDC balance and gas values use 18 decimals; the ERC-20 interface above uses 6 decimals.');
            core.info('This check is read-only. It does not estimate or submit a transaction.');

            const failures = [];
            if (chainId !== 5042) failures.push(`Expected Arc Mainnet chain ID 5042, got ${chainId}`);
            if (!hasCode) failures.push('Configured USDC address returned empty bytecode');
            if (symbol !== 'USDC') failures.push(`Expected USDC symbol, got ${symbol}`);
            if (decimals !== 6) failures.push(`Expected USDC ERC-20 decimals 6, got ${decimals}`);

            if (failures.length) core.setFailed(failures.join('; '));
            else core.info('Arc Mainnet read-only preflight checks passed.');
