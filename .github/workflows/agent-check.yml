name: Minimal agent checks

on:
  push:
    branches:
      - agent/minimal-arc-agent
    paths:
      - "agent/**"
      - ".github/workflows/agent-check.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Verify Arc and deployed contracts (read-only)
        run: npm run check
