name: AgentPay CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, studio-sync]

permissions:
  contents: read

concurrency:
  group: agentpay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Build and test smart contracts with Arc Foundry
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: arc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Arc Foundry v0.8.0-2
        shell: bash
        run: |
          set -euo pipefail
          version="v0.8.0-2"
          archive="arc-foundry-${version}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/circlefin/arc-foundry/releases/download/${version}"
          curl --fail --location --retry 3 "${base}/${archive}" --output "/tmp/${archive}"
          curl --fail --location --retry 3 "${base}/${archive}.sha256" --output "/tmp/${archive}.sha256"
          (cd /tmp && sha256sum --check "${archive}.sha256")
          mkdir -p /tmp/arc-foundry
          tar -xzf "/tmp/${archive}" -C /tmp/arc-foundry
          sudo install -m 0755 /tmp/arc-foundry/forge /usr/local/bin/arc-forge
          sudo install -m 0755 /tmp/arc-foundry/cast /usr/local/bin/arc-cast
          sudo install -m 0755 /tmp/arc-foundry/anvil /usr/local/bin/arc-anvil
          arc-forge --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Confirm Arc execution profile
        shell: bash
        run: |
          set -euo pipefail
          arc-forge config --json | grep -q '"network": "arc"'

      - name: Build contracts
        run: arc-forge build

      - name: Run contract tests under Arc rules
        run: arc-forge test -vv
